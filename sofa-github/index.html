<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofás</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-page">
    <header class="header">
      <img class="site-logo" src="images/logo.png" alt="Logo" onerror="this.style.display='none'">
      <h1>Sofás</h1>
    </header>

    <section class="products">
      <article class="product">
        <img src="images/sofa_tango_retratl_semcx-1024x768.webp" alt="Sofá Tango Retrátil sem Caixa">
        <div class="product-info">
          <strong>SOFÁ TANGO RETRATIL SEM CAIXA</strong>
          <em>R$ 1199,99</em>
        </div>
      </article>

      <article class="product">
        <img src="images/sofaUSB-1024x768.webp" alt="Sofá USB">
        <div class="product-info">
          <strong>SOFÁ USB</strong>
          <em>R$ 2699,99</em>
        </div>
      </article>

      <article class="product">
        <img src="images/sof_cama_bau_multifuncional-1-1024x768.webp" alt="Sofá Cama Baú Multifuncional">
        <div class="product-info">
          <strong>SOFÁ CAMA BAÚ MULTIFUNCIONAL</strong>
          <em>R$ 999,99</em>
        </div>
      </article>

      <article class="product">
        <img src="images/sof_living_fixo.webp" alt="Sofá Living Fixo">
        <div class="product-info">
          <strong>SOFÁ LIVING FIXO</strong>
          <em>R$ 499,99</em>
        </div>
      </article>
    </section>

    <footer class="footer">
      <img class="footer-logo" src="images/logo.png" alt="Logo" onerror="this.style.display='none'">
      <p>Feito por Isabelle e Ronnier</p>
      <div class="social-links" aria-label="Redes sociais">
        <a href="#" aria-label="Facebook">Facebook</a>
        <a href="#" aria-label="Twitter">Twitter</a>
        <a href="#" aria-label="WordPress">WordPress</a>
      </div>
    </footer>
  </main>
</body>
</html>
